<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Moharek - Advanced Business Management Platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moharek">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Material Icons for web -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <title>Moharek</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "234d893b-ca81-493d-9afd-6a287a69b27e",
      });
    });
  </script>
  <style>
    body {
      background-color: #080B12;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 20px rgba(46, 229, 157, 0.2));
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(46, 229, 157, 0.1);
      border-top: 3px solid #2EE59D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .text {
      margin-top: 24px;
      color: #94A3B8;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <img src="favicon.png" alt="Moharek" class="logo">
    <div class="spinner"></div>
    <div class="text">Loading Moharek Dashboard</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function() {
      // Small delay to ensure smooth transition
      setTimeout(function() {
        var loading = document.getElementById('loading');
        if (loading) {
          // Fade out effect
          loading.style.transition = 'opacity 0.5s ease';
          loading.style.opacity = '0';
          setTimeout(function() {
            loading.remove();
          }, 500);
        }
      }, 1000);
    });
  </script>
</body>
</html>
