            --release \
            --build-name=$APP_VERSION \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/moharekRelease/app-moharek-release.aab
      - build/app/outputs/mapping/moharekRelease/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
